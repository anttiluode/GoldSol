name: GoldSol scientific controls
on:
  push:
  pull_request:
jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments/jitter.py --output results/jitter.json
      - run: python experiments/history.py --output results/history.json
      - uses: actions/upload-artifact@v4
        with:
          name: goldsol-experimental-data
          path: results/*.json
